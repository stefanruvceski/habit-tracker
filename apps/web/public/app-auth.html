<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1e" />
  <meta name="robots" content="noindex" />
  <title>Opening Habit Tracker…</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      background: #0a0f1e; color: #eef2ff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 380px; background: #111a30; border: 1px solid #1f2b47;
      border-radius: 18px; padding: 24px 20px; text-align: center;
    }
    .sprout { font-size: 32px; }
    h1 { font-size: 20px; margin: 8px 0 6px; }
    p { color: #9fb0d0; font-size: 14px; line-height: 1.45; margin: 0 0 16px; }
    a.btn {
      display: block; padding: 13px; border-radius: 12px; background: #34d399; color: #0a0f1e;
      font-weight: 700; text-decoration: none; font-size: 16px;
    }
    .hint { color: #64748b; font-size: 12px; margin: 14px 0 0; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="sprout">🌱</div>
    <h1 id="title">Opening the app…</h1>
    <p id="msg">Signing you in to Habit Tracker on this phone.</p>
    <a class="btn" id="open" href="#">Open the app</a>
    <p class="hint">Open this link on the phone where the app is installed. On a computer, just sign in on the website instead.</p>
  </div>
  <script>
    // Supabase redirects here after the magic link (implicit flow: tokens in the
    // URL hash). Hand them to the native app via its streakli:// scheme. This page
    // is static on purpose: the web app's own Supabase client must not consume
    // (and clear) the tokens meant for the phone.
    (function () {
      var hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      var query = new URLSearchParams(location.search);
      var params = new URLSearchParams();
      ["access_token", "refresh_token", "expires_at", "expires_in", "token_type", "type",
       "error", "error_code", "error_description"].forEach(function (k) {
        var v = hash.get(k) || query.get(k);
        if (v) params.set(k, v);
      });
      var qs = params.toString();
      // ?app=dev → the "Streakli Dev" build (separate package + scheme).
      var dev = query.get("app") === "dev";
      var scheme = dev ? "streakli-dev" : "streakli";
      var pkg = dev ? "com.ruvceski.streakli.dev" : "com.ruvceski.streakli";
      var isAndroid = /Android/i.test(navigator.userAgent);
      var target = isAndroid
        ? "intent://auth?" + qs + "#Intent;scheme=" + scheme + ";package=" + pkg + ";end"
        : scheme + "://auth?" + qs;
      document.getElementById("open").href = target;
      if (params.get("error")) {
        document.getElementById("title").textContent = "Link expired";
        var m = document.getElementById("msg");
        m.className = "err";
        m.textContent = (params.get("error_description") || "This sign-in link is no longer valid.") +
          " Request a new link from the app.";
      }
      // Strip tokens from the address bar / history, then try to open the app.
      history.replaceState(null, "", location.pathname);
      location.href = target;
    })();
  </script>
</body>
</html>
