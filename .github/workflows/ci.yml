name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck core
        run: npm run typecheck -w @habit/core

      - name: Typecheck web
        run: npm run typecheck -w web

      - name: Typecheck mobile
        run: npm run typecheck -w mobile

      - name: Lint web
        run: npm run lint:web

      - name: Run tests (core + web + mobile)
        run: npm test

      - name: Build web
        run: npm run build:web
