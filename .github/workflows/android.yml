name: Android APK

# Builds a signed release APK of the Expo app (apps/mobile) and publishes it as
# a GitHub Release tagged `android-b<N>`. The installed app checks these
# releases and offers one-tap updates; `streakli.sh` on the Mac installs the
# newest one over Wi-Fi with adb.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (optional)"
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Client-safe values (RLS protects the data); the same ones the web app ships.
  EXPO_PUBLIC_SUPABASE_URL: https://kyxzniteynjdynscikbn.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_T9KgrKtFYCD8mwHy2wdmGg_PkA1fuSE
  APP_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  apk:
    name: Build & release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        id: signing
        env:
          KS: ${{ secrets.STREAKLI_KEYSTORE_BASE64 }}
          PW: ${{ secrets.STREAKLI_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::warning::No signing secrets — PR test build only (debug key, not released)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing STREAKLI_KEYSTORE_BASE64 / STREAKLI_KEYSTORE_PASSWORD secrets. Run Documents/Streakli/signing/setup-github-secrets.sh on the Mac."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Test mobile
        run: |
          npm run test:core
          npm run typecheck -w mobile
          npm run test -w mobile

      - name: Decode keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KS: ${{ secrets.STREAKLI_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/streakli-release.jks"
          echo "STREAKLI_KEYSTORE_PATH=$RUNNER_TEMP/streakli-release.jks" >> "$GITHUB_ENV"

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild -p android --no-install
        env:
          CI: "1"

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        env:
          STREAKLI_KEYSTORE_PASSWORD: ${{ secrets.STREAKLI_KEYSTORE_PASSWORD }}
          STREAKLI_KEY_PASSWORD: ${{ secrets.STREAKLI_KEYSTORE_PASSWORD }}
          STREAKLI_KEY_ALIAS: streakli
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify signature
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          cp "$APK" streakli.apk
          ls -la streakli.apk

      - name: Upload test APK (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: streakli-pr-apk
          path: streakli.apk
          retention-days: 7

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ github.event.inputs.notes }}
        run: |
          TAG="android-b${APP_BUILD_NUMBER}"
          NOTES="${NOTES_INPUT:-$(git log -1 --pretty=%s)}"
          gh release create "$TAG" streakli.apk \
            --title "Streakli Android · build ${APP_BUILD_NUMBER}" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"
